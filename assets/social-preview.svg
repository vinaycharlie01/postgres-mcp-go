<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="40%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="pgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#336791"/>
      <stop offset="100%" style="stop-color:#4a90d9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#336791;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ADD8;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00ADD8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="200" cy="160" r="200" fill="url(#orb1)"/>
  <circle cx="1080" cy="480" r="180" fill="url(#orb2)"/>

  <!-- Grid -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#58a6ff" stroke-width="1"/>
  </g>

  <!-- Decorative waves -->
  <g filter="url(#softGlow)" opacity="0.1">
    <path d="M 0,320 Q 320,220 640,320 T 1280,320" stroke="#336791" stroke-width="2" fill="none"/>
    <path d="M 0,350 Q 320,450 640,350 T 1280,350" stroke="#00ADD8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- PostgreSQL Elephant -->
  <g transform="translate(130, 155)" filter="url(#glow)">
    <ellipse cx="110" cy="125" rx="90" ry="100" fill="none" stroke="url(#pgBlue)" stroke-width="5" opacity="0.9"/>
    <path d="M 65,180 Q 35,220 50,250 Q 65,265 80,245 Q 88,215 80,185" fill="none" stroke="url(#pgBlue)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 155,60 Q 185,35 195,75 Q 192,110 160,102" fill="none" stroke="url(#pgBlue)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="130" cy="90" r="8" fill="#336791" opacity="0.8"/>
    <circle cx="132" cy="88" r="3.5" fill="#58a6ff"/>
    <path d="M 95,165 Q 73,195 88,205" fill="none" stroke="#8db3d8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Main title -->
  <text x="640" y="265" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#e6edf3" text-anchor="middle" letter-spacing="-2">postgres-mcp-go</text>

  <!-- Subtitle -->
  <text x="640" y="325" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" fill="#8b949e" text-anchor="middle" font-weight="400" letter-spacing="1">Read-only PostgreSQL MCP Server for AI Assistants</text>

  <!-- Feature pills -->
  <g transform="translate(640, 380)">
    <!-- Go -->
    <rect x="-320" y="0" width="80" height="34" rx="17" fill="#00ADD8" opacity="0.15"/>
    <rect x="-320" y="0" width="80" height="34" rx="17" fill="none" stroke="#00ADD8" stroke-width="1.2" opacity="0.5"/>
    <text x="-280" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#00ADD8" text-anchor="middle" font-weight="600">Go 1.27</text>
    <!-- MCP -->
    <rect x="-224" y="0" width="72" height="34" rx="17" fill="#58a6ff" opacity="0.15"/>
    <rect x="-224" y="0" width="72" height="34" rx="17" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
    <text x="-188" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="600">MCP</text>
    <!-- 70+ Tools -->
    <rect x="-136" y="0" width="110" height="34" rx="17" fill="#a371f7" opacity="0.15"/>
    <rect x="-136" y="0" width="110" height="34" rx="17" fill="none" stroke="#a371f7" stroke-width="1.2" opacity="0.5"/>
    <text x="-81" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#a371f7" text-anchor="middle" font-weight="600">70+ Tools</text>
    <!-- Read-Only -->
    <rect x="-10" y="0" width="108" height="34" rx="17" fill="#238636" opacity="0.15"/>
    <rect x="-10" y="0" width="108" height="34" rx="17" fill="none" stroke="#238636" stroke-width="1.2" opacity="0.5"/>
    <text x="44" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="600">Read-Only</text>
    <!-- Homebrew -->
    <rect x="114" y="0" width="110" height="34" rx="17" fill="#d29922" opacity="0.15"/>
    <rect x="114" y="0" width="110" height="34" rx="17" fill="none" stroke="#d29922" stroke-width="1.2" opacity="0.5"/>
    <text x="169" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#d29922" text-anchor="middle" font-weight="600">Homebrew</text>
    <!-- Docker -->
    <rect x="240" y="0" width="86" height="34" rx="17" fill="#2496ed" opacity="0.15"/>
    <rect x="240" y="0" width="86" height="34" rx="17" fill="none" stroke="#2496ed" stroke-width="1.2" opacity="0.5"/>
    <text x="283" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#2496ed" text-anchor="middle" font-weight="600">Docker</text>
  </g>

  <!-- Tagline -->
  <text x="640" y="475" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#484f58" text-anchor="middle" letter-spacing="3" font-weight="300">SCHEMA DISCOVERY  ·  DATA PROFILING  ·  QUERY ANALYSIS  ·  MIGRATION PLANNING</text>

  <!-- Corner accents -->
  <path d="M 0,0 L 100,0 L 0,100 Z" fill="#336791" opacity="0.05"/>
  <path d="M 1280,640 L 1180,640 L 1280,540 Z" fill="#00ADD8" opacity="0.05"/>

  <!-- Bottom accent -->
  <rect x="0" y="632" width="1280" height="8" fill="url(#pgBlue)" opacity="0.6"/>
</svg>