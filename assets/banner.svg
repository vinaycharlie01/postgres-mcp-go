<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="pgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#336791"/>
      <stop offset="100%" style="stop-color:#4a90d9"/>
    </linearGradient>
    <linearGradient id="mcpGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADD8"/>
      <stop offset="100%" style="stop-color:#007d9c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1020" y1="0" x2="1020" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1140" y1="0" x2="1140" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#58a6ff" stroke-width="1"/>
  </g>

  <!-- Decorative connection lines -->
  <g filter="url(#softGlow)" opacity="0.15">
    <path d="M 0,200 Q 200,100 400,200 T 800,200 T 1200,200" stroke="#336791" stroke-width="2" fill="none"/>
    <path d="M 0,220 Q 200,320 400,220 T 800,220 T 1200,220" stroke="#00ADD8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Floating data nodes -->
  <g opacity="0.12">
    <circle cx="100" cy="80" r="4" fill="#336791"/>
    <circle cx="200" cy="320" r="3" fill="#58a6ff"/>
    <circle cx="350" cy="60" r="5" fill="#00ADD8"/>
    <circle cx="850" cy="340" r="4" fill="#336791"/>
    <circle cx="950" cy="70" r="3" fill="#58a6ff"/>
    <circle cx="1100" cy="310" r="5" fill="#00ADD8"/>
    <circle cx="1050" cy="90" r="3" fill="#336791"/>
    <circle cx="150" cy="300" r="4" fill="#00ADD8"/>
  </g>

  <!-- PostgreSQL Elephant Icon -->
  <g transform="translate(180, 120)">
    <!-- Elephant body -->
    <g filter="url(#glow)">
      <ellipse cx="80" cy="90" rx="65" ry="75" fill="none" stroke="url(#pgBlue)" stroke-width="4" opacity="0.9"/>
      <!-- Trunk -->
      <path d="M 50,130 Q 30,160 40,180 Q 50,190 60,175 Q 65,155 60,135" fill="none" stroke="url(#pgBlue)" stroke-width="4" stroke-linecap="round"/>
      <!-- Ear -->
      <path d="M 110,45 Q 135,25 140,55 Q 138,80 115,75" fill="none" stroke="url(#pgBlue)" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Eye -->
      <circle cx="95" cy="65" r="6" fill="#336791" opacity="0.8"/>
      <circle cx="96" cy="64" r="2.5" fill="#58a6ff"/>
      <!-- Tusk -->
      <path d="M 70,120 Q 55,145 65,150" fill="none" stroke="#8db3d8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Connection beam from elephant to text -->
  <g filter="url(#softGlow)">
    <line x1="310" y1="200" x2="390" y2="200" stroke="#58a6ff" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
    <circle cx="310" cy="200" r="4" fill="#58a6ff" opacity="0.5"/>
    <circle cx="390" cy="200" r="4" fill="#58a6ff" opacity="0.5"/>
  </g>

  <!-- Main title -->
  <text x="420" y="175" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="-1">postgres-mcp-go</text>

  <!-- Subtitle -->
  <text x="420" y="220" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#8b949e" font-weight="400" letter-spacing="0.5">Read-only PostgreSQL MCP Server for AI Assistants</text>

  <!-- Tech badges -->
  <g transform="translate(420, 248)">
    <!-- Go badge -->
    <rect x="0" y="0" width="60" height="26" rx="13" fill="#00ADD8" opacity="0.15"/>
    <rect x="0" y="0" width="60" height="26" rx="13" fill="none" stroke="#00ADD8" stroke-width="1" opacity="0.4"/>
    <text x="30" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#00ADD8" text-anchor="middle" font-weight="600">Go</text>

    <!-- MCP badge -->
    <rect x="72" y="0" width="66" height="26" rx="13" fill="#58a6ff" opacity="0.15"/>
    <rect x="72" y="0" width="66" height="26" rx="13" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4"/>
    <text x="105" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="600">MCP</text>

    <!-- PostgreSQL badge -->
    <rect x="150" y="0" width="100" height="26" rx="13" fill="#336791" opacity="0.15"/>
    <rect x="150" y="0" width="100" height="26" rx="13" fill="none" stroke="#336791" stroke-width="1" opacity="0.4"/>
    <text x="200" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#4a90d9" text-anchor="middle" font-weight="600">PostgreSQL</text>

    <!-- Read-only badge -->
    <rect x="262" y="0" width="96" height="26" rx="13" fill="#238636" opacity="0.15"/>
    <rect x="262" y="0" width="96" height="26" rx="13" fill="none" stroke="#238636" stroke-width="1" opacity="0.4"/>
    <text x="310" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950" text-anchor="middle" font-weight="600">Read-Only</text>

    <!-- 70+ Tools badge -->
    <rect x="370" y="0" width="90" height="26" rx="13" fill="#a371f7" opacity="0.15"/>
    <rect x="370" y="0" width="90" height="26" rx="13" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
    <text x="415" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#a371f7" text-anchor="middle" font-weight="600">70+ Tools</text>
  </g>

  <!-- Decorative corner accents -->
  <path d="M 0,0 L 80,0 L 0,80 Z" fill="#336791" opacity="0.06"/>
  <path d="M 1200,400 L 1120,400 L 1200,320 Z" fill="#00ADD8" opacity="0.06"/>

  <!-- Bottom accent line -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#pgBlue)" opacity="0.6"/>
</svg>