version: '3'

vars:
  BINARY_NAME: postgres-mcp-go
  DIST_DIR: dist
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  LDFLAGS: >-
    -s -w
    -X github.com/vinaycharlie01/postgres-mcp-go/pkg/version.Version={{.VERSION}}
    -X github.com/vinaycharlie01/postgres-mcp-go/pkg/version.GitCommit={{.GIT_COMMIT}}

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build binary for current platform
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST_DIR}}/{{.BINARY_NAME}} ./cmd/server

  build-linux:
    desc: Cross-compile linux/amd64 and linux/arm64 binaries
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST_DIR}}/{{.BINARY_NAME}}-linux-amd64 ./cmd/server
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST_DIR}}/{{.BINARY_NAME}}-linux-arm64 ./cmd/server

  test:
    desc: Run unit tests
    cmds:
      - go test -v -short -timeout=120s ./...

  race:
    desc: Run tests with race detector
    cmds:
      - go test -race -short -timeout=120s ./...

  coverage:
    desc: Run tests with coverage profiling
    cmds:
      - go test -coverprofile=coverage.out -timeout=120s ./...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -timeout=120s ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --timeout=10m ./...

  govulncheck:
    desc: Run vulnerability check
    cmds:
      - govulncheck ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}} coverage.out

  release:
    desc: Create a GitHub release via goreleaser
    cmds:
      - goreleaser release --clean

  snapshot:
    desc: Create a local snapshot build via goreleaser
    cmds:
      - goreleaser release --snapshot --clean
